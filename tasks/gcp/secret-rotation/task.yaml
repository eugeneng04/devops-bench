task_id: 18
name: "secret-rotation"
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/secret-rotation"
  teardown: true
prompt: |
  You are the DevOps engineer on call for the GKE cluster '{{CLUSTER_NAME}}' in project
  '{{PROJECT_ID}}'.

  The database credential used by the workloads in the 'secret-rotation' namespace has been
  compromised. Replace it with a new one and make sure the compromised value can no longer
  be used, without interrupting the service that depends on it.

  Write up what you changed and the evidence you gathered in a file named
  'rotation-report.md'.
expected_output: |
  critical requirements:
  - Agent inspects and reads the ExternalSecret 'db-credentials' resource in the "{{NAMESPACE}}" namespace to determine the correct Secret Manager object.
  - Agent creates a new version of the referenced secret in GCP Secret Manager with a new secure value.
  - Agent updates the ExternalSecret resource config in the cluster to point to the new secret version.
  - Agent performs a rolling restart of the deployment (e.g. 'db-secret-viewer') that consumes the secret.
  - The application successfully completes its rolling restart, is healthy, and is actively consuming the new secret value.
  - Service availability is maintained throughout the rotation process with zero downtime or service disruption.
  - The compromised old version of the secret in GCP Secret Manager is successfully revoked (destroyed or disabled).
